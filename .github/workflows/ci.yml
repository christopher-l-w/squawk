name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://squawk:squawk@localhost:5432/squawk
      WEB_ORIGIN: http://localhost:5173
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: squawk
          POSTGRES_PASSWORD: squawk
          POSTGRES_DB: squawk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U squawk -d squawk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply database migrations
        run: npm run db:migrate
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
